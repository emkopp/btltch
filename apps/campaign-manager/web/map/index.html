<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campaign Navigator — Mercenary Manager</title>
  <link rel="stylesheet" href="campaign-map.css" />
</head>
<body>
  <header class="map-header">
    <a href="/">&#9664; Main Menu</a>
    <div>
      <h1>Campaign Navigator</h1>
      <p>Inner Sphere operational travel map</p>
    </div>
    <label class="system-search">
      Find system
      <input id="system-search" type="search" placeholder="Enter system name" autocomplete="off" />
    </label>
  </header>

  <main class="navigator-layout">
    <section class="map-stage" aria-label="Inner Sphere system map">
      <canvas id="campaign-map"></canvas>
      <div class="map-legend">
        <span><i class="current"></i>Current</span>
        <span><i class="visited"></i>Visited</span>
        <span><i class="jump-1"></i>1 jump</span>
        <span><i class="jump-2"></i>2 jumps</span>
        <span><i class="jump-3"></i>3 jumps</span>
        <span><i class="distant"></i>Distant</span>
      </div>
      <div id="map-tooltip" class="map-tooltip" hidden></div>
    </section>

    <aside class="navigation-panel">
      <section class="location-card">
        <span class="eyebrow">Current location</span>
        <h2 id="current-system">Loading...</h2>
        <p id="current-affiliation"></p>
      </section>

      <section id="selection-panel" class="selection-panel">
        <span class="eyebrow">Destination</span>
        <h2 id="selected-system">Select a reachable system</h2>
        <p id="selected-affiliation">Choose from the map or destination list.</p>
        <ol id="selected-route" class="selected-route"></ol>
        <button id="jump-button" type="button" disabled>Choose a destination</button>
        <p id="jump-status" class="status-message" aria-live="polite"></p>
      </section>

      <section class="destinations">
        <div class="section-heading">
          <h2>Destinations within 3 jumps</h2>
          <span id="destination-count"></span>
        </div>
        <div id="destination-list"></div>
      </section>

      <section class="travel-memory">
        <div class="section-heading">
          <h2>Travel memory</h2>
          <span id="visited-count"></span>
        </div>
        <ol id="travel-history"></ol>
      </section>
    </aside>
  </main>

  <script src="campaign-map.js"></script>
</body>
</html>
